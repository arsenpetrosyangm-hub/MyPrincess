<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For My Princess ✨</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #02010a;
      font-family: Georgia, "Noto Serif Armenian", serif;
      color: white;
    }

    /* =========================
       REALISTIC NIGHT SKY
    ========================== */

    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 50% 48%,
          rgba(73, 57, 145, .28) 0%,
          rgba(27, 20, 70, .20) 25%,
          rgba(7, 5, 25, .75) 58%,
          #010108 100%
        );

      z-index: 0;
    }

    /* Млечный путь */
    .sky::before {
      content: "";
      position: absolute;
      width: 150%;
      height: 55%;
      left: -25%;
      top: 18%;

      background:
        radial-gradient(
          ellipse,
          rgba(255,255,255,.10) 0%,
          rgba(170,150,255,.06) 25%,
          transparent 65%
        );

      transform: rotate(-17deg);
      filter: blur(12px);
      opacity: .75;
    }

    .sky::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(circle at 20% 30%, rgba(130,100,255,.08), transparent 25%),
        radial-gradient(circle at 80% 65%, rgba(255,100,190,.05), transparent 30%);

      pointer-events: none;
    }

    /* Звёзды */

    .stars {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .star {
      position: absolute;
      border-radius: 50%;

      background: #fff;

      box-shadow:
        0 0 4px rgba(255,255,255,.9),
        0 0 10px rgba(180,190,255,.7);

      animation: realisticTwinkle
        var(--duration)
        ease-in-out
        infinite alternate;
    }

    @keyframes realisticTwinkle {
      0% {
        opacity: .25;
        transform: scale(.75);
      }

      50% {
        opacity: .65;
      }

      100% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    /* =========================
       INTRO
    ========================== */

    .intro {
      position: absolute;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;

      z-index: 5;

      animation: intro 5s forwards;
    }

    .intro h1 {
      width: 90%;

      font-size: clamp(32px, 7vw, 75px);
      font-weight: 400;
      letter-spacing: 2px;

      color: #fff;

      text-shadow:
        0 0 10px #fff,
        0 0 25px #d8c6ff,
        0 0 55px #8b6cff,
        0 0 90px rgba(130,90,255,.5);
    }

    @keyframes intro {
      0% {
        opacity: 0;
        transform: scale(.8);
      }

      20% {
        opacity: 1;
        transform: scale(1);
      }

      65% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: scale(1.3);
        visibility: hidden;
      }
    }

    /* =========================
       REALISTIC FALLING STAR
    ========================== */

    .falling-star {
      position: absolute;

      top: -120px;
      left: 50%;

      width: 110px;
      height: 110px;

      transform: translateX(-50%);

      z-index: 10;

      opacity: 0;

      cursor: pointer;

      animation:
        fall 4.5s 5s forwards,
        starPulse 1.5s 9.5s infinite ease-in-out;
    }

    .falling-star::before {
      content: "";

      position: absolute;

      width: 20px;
      height: 20px;

      left: 45px;
      top: 45px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #ffffff 0%,
          #fffbd0 25%,
          #ffe36b 55%,
          #ff9d00 100%
        );

      box-shadow:
        0 0 8px #fff,
        0 0 20px #fff5a0,
        0 0 45px #ffd83d,
        0 0 80px #ff9900;
    }

    /* хвост */
    .falling-star::after {
      content: "";

      position: absolute;

      width: 180px;
      height: 12px;

      left: -130px;
      top: 49px;

      border-radius: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,220,100,.08),
          rgba(255,240,150,.35),
          rgba(255,255,255,.9)
        );

      filter: blur(4px);

      transform: rotate(-8deg);
    }

    @keyframes fall {
      0% {
        opacity: 0;
        top: -120px;
        transform:
          translateX(-50%)
          rotate(-10deg);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 1;

        top: 45%;

        transform:
          translateX(-50%)
          rotate(10deg);
      }
    }

    @keyframes starPulse {
      0%, 100% {
        filter: brightness(1);
        transform: translateX(-50%) scale(1);
      }

      50% {
        filter: brightness(1.6);
        transform: translateX(-50%) scale(1.18);
      }
    }

    /* =========================
       HINT
    ========================== */

    .hint {
      position: absolute;

      top: calc(45% + 80px);
      left: 50%;

      transform: translateX(-50%);

      z-index: 12;

      opacity: 0;

      animation: hint 2s 8s forwards;

      color: rgba(255,255,255,.65);

      font-family: Arial, sans-serif;
      font-size: 13px;

      white-space: nowrap;
    }

    @keyframes hint {
      to {
        opacity: 1;
      }
    }

    /* =========================
       DARK OVERLAY
    ========================== */

    .dark {
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle,
          rgba(20,10,50,.65),
          rgba(0,0,0,.88)
        );

      opacity: 0;
      visibility: hidden;

      transition: 1.5s;

      z-index: 20;
    }

    .dark.active {
      opacity: 1;
      visibility: visible;
    }

    /* =========================
       FAIRYTALE CARD
    ========================== */

    .card {
      position: fixed;

      left: 50%;
      top: 50%;

      width: min(90%, 620px);
      min-height: 450px;

      transform:
        translate(-50%, -50%)
        scale(.2)
        rotateY(90deg);

      opacity: 0;
      visibility: hidden;

      z-index: 30;

      padding: 55px 35px;

      border-radius: 35px;

      text-align: center;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(52, 30, 100, .96),
          rgba(10, 6, 32, .98)
        );

      border: 1px solid rgba(255,255,255,.25);

      box-shadow:
        0 0 30px rgba(180,100,255,.35),
        0 0 80px rgba(255,90,180,.18),
        inset 0 0 50px rgba(255,255,255,.04);

      transition:
        transform 1.2s cubic-bezier(.17,.89,.32,1.3),
        opacity 1s;
    }

    .card::before {
      content: "";

      position: absolute;
      inset: -50%;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,.08),
          transparent 45%
        );

      animation: cardGlow 6s linear infinite;
    }

    @keyframes cardGlow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .card.active {
      opacity: 1;
      visibility: visible;

      transform:
        translate(-50%, -50%)
        scale(1)
        rotateY(0);
    }

    /* =========================
       FROM A TO M
    ========================== */

    .from-top {
      position: relative;
      z-index: 2;

      margin-bottom: 15px;

      font-family: Georgia, serif;

      font-size: 17px;

      letter-spacing: 4px;

      color: #ffd8ef;

      text-shadow:
        0 0 10px #ff72b6,
        0 0 25px rgba(255,100,190,.7);
    }

    /* =========================
       CARTOON HEART
    ========================== */

    .heart {
      position: relative;

      z-index: 2;

      display: inline-block;

      font-size: 70px;

      filter:
        drop-shadow(0 0 8px #ff75b5)
        drop-shadow(0 0 25px #ff2e8a);

      animation:
        cartoonHeart 1.5s infinite ease-in-out;
    }

    @keyframes cartoonHeart {
      0%, 100% {
        transform: scale(1) rotate(-3deg);
      }

      25% {
        transform: scale(1.12) rotate(3deg);
      }

      50% {
        transform: scale(1.22) rotate(-3deg);
      }

      75% {
        transform: scale(1.08) rotate(2deg);
      }
    }

    /* =========================
       TITLE
    ========================== */

    .card h2 {
      position: relative;
      z-index: 2;

      margin-top: 12px;

      font-size: clamp(32px, 7vw, 48px);

      font-weight: 400;

      color: #fff;

      text-shadow:
        0 0 10px #fff,
        0 0 25px #ffc6e6,
        0 0 45px #ff65aa;
    }

    /* =========================
       MESSAGE
    ========================== */

    .message {
      position: relative;
      z-index: 2;

      margin-top: 28px;

      font-size: clamp(20px, 4vw, 28px);

      line-height: 1.6;

      color: #fff5fb;

      text-shadow:
        0 0 10px rgba(255,255,255,.35);
    }

    /* =========================
       YEARS
    ========================== */

    .years {
      position: relative;
      z-index: 2;

      margin-top: 25px;

      font-size: 23px;

      color: #ffd2e8;

      text-shadow:
        0 0 10px #ff6cae,
        0 0 25px #ff3c91;
    }

    /* =========================
       FAIRYTALE DECORATIONS
    ========================== */

    .magic {
      position: absolute;

      pointer-events: none;

      z-index: 1;

      animation: magicFloat 5s infinite ease-in-out;
    }

    .magic.star1 {
      top: 25px;
      left: 35px;
      font-size: 25px;
    }

    .magic.star2 {
      top: 45px;
      right: 45px;
      font-size: 18px;
    }

    .magic.crown {
      bottom: 30px;
      left: 45px;
      font-size: 27px;
    }

    .magic.butterfly {
      bottom: 25px;
      right: 40px;
      font-size: 25px;
    }

    @keyframes magicFloat {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
        opacity: .6;
      }

      50% {
        transform: translateY(-12px) rotate(8deg);
        opacity: 1;
      }
    }

    /* =========================
       FLYING CARTOON HEARTS
    ========================== */

    .hearts {
      position: fixed;
      inset: 0;

      pointer-events: none;
      overflow: hidden;

      z-index: 25;
    }

    .heart-fly {
      position: absolute;

      bottom: -60px;

      animation:
        flyHeart linear forwards;

      text-shadow:
        0 0 8px currentColor,
        0 0 18px currentColor;

      will-change: transform;
    }

    @keyframes flyHeart {
      0% {
        transform:
          translateY(0)
          translateX(0)
          scale(.4)
          rotate(-15deg);

        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform:
          translateY(-110vh)
          translateX(var(--x))
          scale(1.3)
          rotate(360deg);

        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- SKY -->
  <div class="sky"></div>
  <div class="stars" id="stars"></div>

  <!-- INTRO -->
  <div class="intro">
    <h1>All the stars are for my princess ✨</h1>
  </div>

  <!-- FALLING STAR -->
  <div class="falling-star" id="fallingStar"></div>

  <div class="hint">
    ✨ Tap the star ✨
  </div>

  <!-- DARK -->
  <div class="dark" id="dark"></div>

  <!-- FLOATING ELEMENTS -->
  <div class="hearts" id="hearts"></div>

  <!-- CARD -->
  <div class="card" id="card">

    <div class="magic star1">✦</div>
    <div class="magic star2">✧</div>
    <div class="magic crown">👑</div>
    <div class="magic butterfly">🦋</div>

    <div class="from-top">
      From A to M
    </div>

    <div class="heart">
      💖
    </div>

    <h2>
      My Princess
    </h2>

    <div class="message">
      4 years have passed,<br>
      but the fire didn't go out. 🔥❤️
    </div>

    <div class="years">
      Forever in my heart ✨
    </div>

  </div>

  <script>

    /* =========================
       REALISTIC STARS
    ========================== */

    const stars = document.getElementById("stars");

    for (let i = 0; i < 260; i++) {

      const star = document.createElement("div");

      star.className = "star";

      star.style.left =
        Math.random() * 100 + "%";

      star.style.top =
        Math.random() * 100 + "%";

      const size =
        Math.random() < .85
          ? Math.random() * 2 + .4
          : Math.random() * 3 + 2;

      star.style.width =
        size + "px";

      star.style.height =
        size + "px";

      star.style.opacity =
        .25 + Math.random() * .75;

      star.style.setProperty(
        "--duration",
        (2 + Math.random() * 4) + "s"
      );

      star.style.animationDelay =
        Math.random() * 5 + "s";

      stars.appendChild(star);
    }


    /* =========================
       OPEN CARD
    ========================== */

    const fallingStar =
      document.getElementById("fallingStar");

    const card =
      document.getElementById("card");

    const dark =
      document.getElementById("dark");

    const hearts =
      document.getElementById("hearts");


    fallingStar.addEventListener("click", () => {

      fallingStar.style.display = "none";

      dark.classList.add("active");

      setTimeout(() => {

        card.classList.add("active");

      }, 500);

      createHearts();

    });


    /* =========================
       CARTOON HEARTS + MAGIC
    ========================== */

    function createHearts() {

      for (let i = 0; i < 35; i++) {

        setTimeout(() => {

          const heart =
            document.createElement("div");

          heart.className =
            "heart-fly";

          const items = [
            "💖",
            "💗",
            "💕",
            "💞",
            "💓",
            "✨",
            "🌸",
            "🦋"
          ];

          heart.innerHTML =
            items[Math.floor(
              Math.random() * items.length
            )];

          heart.style.left =
            Math.random() * 100 + "%";

          heart.style.fontSize =
            (16 + Math.random() * 28) + "px";

          heart.style.animationDuration =
            (5 + Math.random() * 6) + "s";

          heart.style.setProperty(
            "--x",
            (Math.random() * 250 - 125) + "px"
          );

          hearts.appendChild(heart);

          setTimeout(() => {
            heart.remove();
          }, 12000);

        }, i * 120);

      }

      setTimeout(
        createHearts,
        6500
      );
    }

  </script>

</body>
</html>
